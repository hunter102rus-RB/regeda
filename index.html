    <p class="hint">Нажмите кнопку для перехода к анкете.<br><b>Если откроется приложение — вернитесь и зажмите кнопку, затем выберите «Открыть в новой вкладке»</b></p>
</div>

<script>

    };
</script>

</body>
</html>
